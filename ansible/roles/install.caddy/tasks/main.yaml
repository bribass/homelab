- name: Install Caddy from Debian
  become: true
  ansible.builtin.apt:
    update_cache: true
    install_recommends: false
    name: caddy
    state: present
  when: ansible_distribution == "Debian"

- name: Configure Caddy
  ansible.builtin.copy:
    src: conf/Caddyfile
    dest: /etc/caddy/
    owner: root
    group: root
    mode: '0644'
  when: ansible_distribution == "Debian"
  notify: Restart Caddy
