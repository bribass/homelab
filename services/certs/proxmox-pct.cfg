arch: amd64
cores: 1
features: nesting=1
hostname: certs
memory: 1024
mp0: /tank/certs-data,mp=/opt/ucm
net0: name=eth0,bridge=vmbr0,firewall=1,hwaddr=BC:24:11:5D:B0:27,ip=dhcp,ip6=dhcp,type=veth
ostype: debian
rootfs: case-drives:subvol-104-disk-0,size=8G
startup: order=3,up=60
swap: 512
unprivileged: 1
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
lxc.idmap: u 0 100000 200000
lxc.idmap: g 0 100000 200000
